<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Watermark PDF — CatchPDF</title>
    <link rel="stylesheet" href="shared.css">
    <script src="config.js"></script>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">CatchPDF</a></nav>
    <div class="tool-container">
        <h1>🎨 Watermark PDF</h1>
        <p>Add custom text watermark to your documents.</p>
        
        <input type="file" id="fileInput" hidden accept=".pdf">
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 3rem;">🖋️</div>
            <p>Select PDF File</p>
        </div>

        <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center;">
            <input type="text" id="wmText" placeholder="Watermark Text (e.g. CONFIDENTIAL)" style="padding: 12px; width: 80%; border-radius: 8px; border: 1px solid #ddd;">
            <select id="wmPos" style="padding: 10px; width: 84%; border-radius: 8px;">
                <option value="center">Center</option>
                <option value="top-left">Top Left</option>
                <option value="bottom-right">Bottom Right</option>
            </select>
        </div>

        <div id="status" style="margin-top: 20px; font-weight: 600;"></div>
        <button onclick="runWatermark()" class="btn-primary" style="margin-top: 15px;">Add Watermark</button>
        <a id="downloadBtn" class="btn-primary" style="display: none; margin-top: 20px; text-decoration: none;">Download File</a>
    </div>

    <script>
        async function runWatermark() {
            const file = document.getElementById('fileInput').files[0];
            const text = document.getElementById('wmText').value;
            if(!file || !text) return alert("Fill all details");

            document.getElementById('status').innerText = "Adding Watermark...";
            const fd = new FormData();
            fd.append('file', file);
            fd.append('text', text);
            fd.append('position', document.getElementById('wmPos').value);

            const res = await fetch(window.CATCHPDF_CONFIG.API_BASE + "/add-watermark", { method: 'POST', body: fd });
            const blob = await res.blob();
            document.getElementById('downloadBtn').href = window.URL.createObjectURL(blob);
            document.getElementById('downloadBtn').download = "CatchPDF_Watermarked.pdf";
            document.getElementById('downloadBtn').style.display = "inline-block";
            document.getElementById('status').innerText = "Done!";
        }
    </script>
</body>
</html>
