<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF to Text — CatchPDF</title>
    <link rel="stylesheet" href="shared.css">
    <script src="config.js"></script>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">CatchPDF</a></nav>
    <div class="tool-container">
        <h1>📄 PDF to Text</h1>
        <p>Extract all text content from your PDF instantly.</p>
        <input type="file" id="fileInput" hidden accept=".pdf">
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 3rem;">📄</div>
            <p>Choose PDF File</p>
        </div>
        <div id="status" style="margin-top: 20px;"></div>
        <button onclick="runText()" class="btn-primary" style="margin-top: 15px;">Extract Text</button>
        <a id="downloadBtn" class="btn-primary" style="display: none; margin-top: 20px; text-decoration: none;">Download .TXT</a>
    </div>
    <script>
        async function runText() {
            const file = document.getElementById('fileInput').files[0];
            if(!file) return alert("Select a file");
            document.getElementById('status').innerText = "Extracting text...";
            const fd = new FormData();
            fd.append('file', file);
            const res = await fetch(window.CATCHPDF_CONFIG.API_BASE + "/pdf-to-text", { method: 'POST', body: fd });
            const blob = await res.blob();
            document.getElementById('downloadBtn').href = window.URL.createObjectURL(blob);
            document.getElementById('downloadBtn').download = "CatchPDF_Text.txt";
            document.getElementById('downloadBtn').style.display = "inline-block";
            document.getElementById('status').innerText = "Extraction Finished!";
        }
    </script>
</body>
</html>
