<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF to Excel — CatchPDF</title>
    <link rel="stylesheet" href="shared.css">
    <script src="config.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">CatchPDF</a>
    </nav>

    <div class="tool-container">
        <h1>📊 PDF to Excel</h1>
        <p>Smartly merge tables with matching headers into one sheet.</p>
        
        <div class="upload-box" id="drop-zone" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" hidden accept=".pdf">
            <div style="font-size: 3rem;">📄</div>
            <p>Click or Drag PDF here</p>
        </div>

        <div id="status" style="margin-top: 20px; font-weight: 600; color: var(--primary);"></div>
        <a id="downloadBtn" class="btn-primary" style="display: none; margin-top: 20px; text-decoration: none; display: inline-block;">Download Excel</a>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        fileInput.onchange = async () => {
            const file = fileInput.files[0];
            if(!file) return;

            document.getElementById('status').innerText = "Processing... Matching headers and merging data.";
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(window.CATCHPDF_CONFIG.API_BASE + "/pdf-to-excel", {
                    method: 'POST',
                    body: formData
                });
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const dl = document.getElementById('downloadBtn');
                dl.href = url;
                dl.download = "CatchPDF_Converted.xlsx";
                dl.style.display = "inline-block";
                document.getElementById('status').innerText = "Ready!";
            } catch (e) {
                document.getElementById('status').innerText = "Error occurred.";
            }
        };
    </script>
</body>
</html>
