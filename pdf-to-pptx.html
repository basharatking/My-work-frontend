<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF to PowerPoint — CatchPDF</title>
    <link rel="stylesheet" href="shared.css">
    <script src="config.js"></script>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">CatchPDF</a></nav>
    <div class="tool-container">
        <h1>📊 PDF to PowerPoint</h1>
        <p>Convert your PDF pages into editable PowerPoint slides.</p>
        <input type="file" id="fileInput" hidden accept=".pdf">
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 3rem;">📊</div>
            <p>Upload PDF to Convert</p>
        </div>
        <div id="status" style="margin-top: 20px; font-weight: 600;"></div>
        <button onclick="runPPTX()" class="btn-primary" style="margin-top: 15px;">Convert to PPTX</button>
        <a id="downloadBtn" class="btn-primary" style="display: none; margin-top: 20px; text-decoration: none;">Download Slides</a>
    </div>
    <script>
        async function runPPTX() {
            const file = document.getElementById('fileInput').files[0];
            if(!file) return alert("Select a file");
            document.getElementById('status').innerText = "Converting to Slides...";
            const fd = new FormData();
            fd.append('file', file);
            try {
                const res = await fetch(window.CATCHPDF_CONFIG.API_BASE + "/pdf-to-pptx", { method: 'POST', body: fd });
                const blob = await res.blob();
                document.getElementById('downloadBtn').href = window.URL.createObjectURL(blob);
                document.getElementById('downloadBtn').download = "CatchPDF_Slides.pptx";
                document.getElementById('downloadBtn').style.display = "inline-block";
                document.getElementById('status').innerText = "Success!";
            } catch (e) { document.getElementById('status').innerText = "Error in conversion."; }
        }
    </script>
</body>
</html>
