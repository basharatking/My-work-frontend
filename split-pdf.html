<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Split PDF — CatchPDF</title>
    <link rel="stylesheet" href="shared.css">
    <script src="config.js"></script>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">CatchPDF</a></nav>
    <div class="tool-container">
        <h1>✂️ Split PDF</h1>
        <p>Extract specific pages or ranges from your PDF.</p>
        <input type="file" id="fileInput" hidden accept=".pdf">
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 3rem;">✂️</div>
            <p>Upload PDF to Split</p>
        </div>
        <div style="margin-top: 20px;">
            <input type="text" id="range" placeholder="e.g. 1-3 or 5" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd; width: 80%;">
        </div>
        <div id="status" style="margin-top: 20px;"></div>
        <button onclick="runSplit()" class="btn-primary" style="margin-top: 15px;">Split PDF</button>
        <a id="downloadBtn" class="btn-primary" style="display: none; margin-top: 20px; text-decoration: none;">Download Pages</a>
    </div>
    <script>
        async function runSplit() {
            const file = document.getElementById('fileInput').files[0];
            const range = document.getElementById('range').value;
            if(!file || !range) return alert("Select file and enter range");
            document.getElementById('status').innerText = "Splitting...";
            const fd = new FormData();
            fd.append('file', file);
            fd.append('range', range);
            const res = await fetch(window.CATCHPDF_CONFIG.API_BASE + "/split-pdf", { method: 'POST', body: fd });
            const blob = await res.blob();
            document.getElementById('downloadBtn').href = window.URL.createObjectURL(blob);
            document.getElementById('downloadBtn').download = "CatchPDF_Split.pdf";
            document.getElementById('downloadBtn').style.display = "inline-block";
            document.getElementById('status').innerText = "Done!";
        }
    </script>
</body>
</html>
