<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign In — RunDocs</title>
<meta name="description" content="Sign in to your RunDocs account to access premium PDF tools.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://rundocs.netlify.app/sign-in">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="config.js"></script>
<style>
.signin-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(var(--nav-h) + 2rem) 1.25rem 3rem;
  background: var(--bg);
}
.signin-card {
  width: 100%;
  max-width: 420px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--r2xl);
  padding: 2.5rem 2rem;
  box-shadow: var(--shadow-md);
}
.signin-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 2rem;
  text-decoration: none;
}
.signin-logo-mark {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, #3B55E0 0%, #4F6EF7 50%, #6B85FF 100%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(79,110,247,.35);
}
.signin-logo-mark i { font-size: 18px; color: #fff; }
.signin-logo-name {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 700;
  color: var(--ink); letter-spacing: -.4px;
}
.signin-logo-name span { color: var(--brand); }
.signin-title {
  font-size: 22px; font-weight: 700;
  color: var(--ink); text-align: center;
  margin-bottom: .4rem; letter-spacing: -.3px;
}
.signin-sub {
  font-size: 14px; color: var(--ink4);
  text-align: center; margin-bottom: 2rem;
}
.signin-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 1.4rem 0; color: var(--ink4); font-size: 12.5px;
}
.signin-divider::before,
.signin-divider::after {
  content: ""; flex: 1;
  height: 1px; background: var(--border);
}
.social-btn {
  width: 100%; display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 11px 16px;
  border: 1.5px solid var(--border); border-radius: var(--r);
  background: var(--bg); color: var(--ink);
  font-size: 14px; font-weight: 500;
  cursor: pointer; transition: var(--t); text-decoration: none;
  font-family: var(--font); margin-bottom: 10px;
}
.social-btn:hover { border-color: var(--brand-border); background: var(--brand-pale); }
.social-btn img { width: 18px; height: 18px; }
.f-label {
  display: block; font-size: 13px;
  font-weight: 600; color: var(--ink2);
  margin-bottom: 6px;
}
.f-input-wrap {
  position: relative; margin-bottom: 1rem;
}
.f-input-wrap i {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--ink4); font-size: 16px; pointer-events: none;
}
.f-input-icon {
  width: 100%; padding: 11px 12px 11px 38px;
  border: 1.5px solid var(--border); border-radius: var(--r);
  font-size: 14px; color: var(--ink); background: var(--bg);
  font-family: var(--font); outline: none; transition: var(--t);
}
.f-input-icon:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,110,247,.1); }
.f-input-icon::placeholder { color: var(--ink4); }
.eye-btn {
  position: absolute; right: 10px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  color: var(--ink4); padding: 4px;
  font-size: 16px; transition: var(--t);
}
.eye-btn:hover { color: var(--brand); }
.forgot-link {
  display: block; text-align: right;
  font-size: 12.5px; color: var(--brand);
  text-decoration: none; margin-top: -8px;
  margin-bottom: 1.25rem; font-weight: 500;
}
.forgot-link:hover { text-decoration: underline; }
.signin-btn {
  width: 100%; padding: 12px;
  background: var(--brand); color: #fff;
  border: none; border-radius: var(--r);
  font-size: 15px; font-weight: 600;
  cursor: pointer; transition: var(--t);
  font-family: var(--font);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.signin-btn:hover { background: var(--brand-dark); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(79,110,247,.4); }
.signin-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
.signup-link {
  text-align: center; margin-top: 1.5rem;
  font-size: 13.5px; color: var(--ink4);
}
.signup-link a { color: var(--brand); font-weight: 600; text-decoration: none; }
.signup-link a:hover { text-decoration: underline; }
.signin-notice {
  display: flex; align-items: flex-start; gap: 8px;
  background: var(--brand-pale); border: 1px solid var(--brand-border);
  border-radius: var(--r); padding: 11px 13px;
  font-size: 12.5px; color: var(--brand); line-height: 1.5;
  margin-top: 1.5rem;
}
.error-msg {
  background: var(--red-bg); border: 1px solid #FAD3D3;
  border-radius: var(--r); padding: 10px 13px;
  font-size: 13px; color: var(--red);
  margin-bottom: 1rem; display: none;
  align-items: center; gap: 7px;
}
.error-msg.show { display: flex; }
</style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="signin-page">
  <div class="signin-card">

    <a href="/" class="signin-logo">
      <div class="signin-logo-mark"><i class="ti ti-file-text" aria-hidden="true"></i></div>
      <div class="signin-logo-name">Run<span>Docs</span></div>
    </a>

    <h1 class="signin-title">Welcome back</h1>
    <p class="signin-sub">Sign in to your RunDocs account</p>

    <!-- Google Sign In -->
    <button class="social-btn" onclick="handleGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <div class="signin-divider">or sign in with email</div>

    <div class="error-msg" id="err-msg">
      <i class="ti ti-alert-circle" aria-hidden="true"></i>
      <span id="err-text">Invalid email or password.</span>
    </div>

    <label class="f-label" for="email">Email address</label>
    <div class="f-input-wrap">
      <i class="ti ti-mail" aria-hidden="true"></i>
      <input class="f-input-icon" id="email" type="email" placeholder="you@example.com" autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('password').focus()">
    </div>

    <label class="f-label" for="password">Password</label>
    <div class="f-input-wrap">
      <i class="ti ti-lock" aria-hidden="true"></i>
      <input class="f-input-icon" id="password" type="password" placeholder="Enter your password" autocomplete="current-password" onkeydown="if(event.key==='Enter')handleSignIn()">
      <button class="eye-btn" type="button" onclick="togglePwd()" aria-label="Show password"><i class="ti ti-eye" id="eye-icon" aria-hidden="true"></i></button>
    </div>

    <a href="/contact" class="forgot-link">Forgot password?</a>

    <button class="signin-btn" id="signin-btn" onclick="handleSignIn()">
      <i class="ti ti-login" aria-hidden="true"></i>
      Sign In
    </button>

    <div class="signup-link">
      Don't have an account? <a href="/contact">Get Pro →</a>
    </div>

    <div class="signin-notice">
      <i class="ti ti-info-circle" style="flex-shrink:0;margin-top:1px" aria-hidden="true"></i>
      <span>RunDocs Pro accounts are currently managed manually. <a href="/contact" style="color:var(--brand);font-weight:600">Contact us</a> to get your account set up.</span>
    </div>

  </div>
</div>

<div id="footer-placeholder"></div>
<script src="shared.js"></script>
<script>
function togglePwd(){
  const inp = document.getElementById("password");
  const ico = document.getElementById("eye-icon");
  if(inp.type === "password"){
    inp.type = "text";
    ico.className = "ti ti-eye-off";
  } else {
    inp.type = "password";
    ico.className = "ti ti-eye";
  }
}

function showError(msg){
  const el = document.getElementById("err-msg");
  document.getElementById("err-text").textContent = msg;
  el.classList.add("show");
}

function handleSignIn(){
  const email = document.getElementById("email").value.trim();
  const pwd   = document.getElementById("password").value;
  document.getElementById("err-msg").classList.remove("show");

  if(!email){ showError("Please enter your email address."); return; }
  if(!email.includes("@")){ showError("Please enter a valid email address."); return; }
  if(!pwd){ showError("Please enter your password."); return; }

  const btn = document.getElementById("signin-btn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Signing in…`;

  // Placeholder — connect to auth backend when ready
  setTimeout(()=>{
    btn.disabled = false;
    btn.innerHTML = `<i class="ti ti-login" aria-hidden="true"></i> Sign In`;
    showError("Account not found. Contact us to set up your Pro account.");
  }, 1200);
}

function handleGoogle(){
  // Placeholder — connect to Google OAuth when ready
  showError("Google sign-in coming soon. Please use email or contact us.");
}
</script>
</body>
</html>
