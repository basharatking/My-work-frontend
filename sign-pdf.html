<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign PDF — RunDocs</title>
<meta name="description" content="Add a text or drawn signature to your PDF. Free, no signup required.">
<meta name="robots" content="index,follow"><meta name="author" content="RunDocs"><meta name="theme-color" content="#2563EB">
<link rel="canonical" href="https://rundocs.netlify.app/signpdf.html">
<meta property="og:title" content="Sign PDF — RunDocs"><meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="config.js"></script>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="tool-page">
  <div class="tool-container">
    <div class="tool-header">
      <div class="tool-icon-wrap"></div>
      <h1 class="tool-title">Sign PDF</h1>
      <p class="tool-sub">Add your text signature to any PDF. Choose position and style.</p>
    </div>
    <div class="tool-card">
      <div class="upload-zone" onclick="document.getElementById('fi-signpdf').click()">
        <div class="uz-icon"></div>
        <div class="uz-title">Drop your PDF here or click to browse</div>
        <div class="uz-sub">Up to 25 MB free · Secure &amp; private</div>
        <div class="uz-badge">🔒 Files deleted after processing</div>
        <input class="file-input" id="fi-signpdf" type="file" accept=".pdf" onchange="handleFiles('signpdf',this)">
      </div>
      <div class="file-chips" id="fl-signpdf"></div>
      <div class="pdf-preview-area" id="preview-signpdf"><div class="pdf-preview-header"><span>Preview</span><strong></strong></div><div class="pdf-canvas-wrap"></div></div>
      <div id="ocr-hint-signpdf"></div>
      <label class="f-label">Your Name / Signature Text</label>
      <input class="f-input" id="sign-name" type="text" placeholder="e.g. Muhammad Ali">
      <label class="f-label">Position</label>
      <select class="f-select" id="sign-position">
        <option value="bottom-right" selected>Bottom Right</option>
        <option value="bottom-center">Bottom Center</option>
        <option value="bottom-left">Bottom Left</option>
      </select>
      <label class="f-label">Apply To</label>
      <select class="f-select" id="sign-pages">
        <option value="last" selected>Last Page Only</option>
        <option value="all">All Pages</option>
        <option value="first">First Page Only</option>
      </select>
      <button class="action-btn" id="btn-signpdf" onclick="run_signpdf()">Sign PDF</button>
      <div class="progress-wrap" id="pw-signpdf"><div class="progress-track"><div class="progress-fill" id="pb-signpdf"></div></div><div class="progress-label" id="pl-signpdf">Processing…</div></div>
      <div class="result-box" id="rb-signpdf"><p id="rb-signpdf-msg"></p></div>
    </div>
<script>
async function run_signpdf(){
  const files=fileStore["signpdf"]; if(!files?.length){toast("Please select a file first","error");return;}
  const name=document.getElementById("sign-name").value.trim();
  if(!name){toast("Please enter your signature text","error");return;}
  setBtnState("signpdf",true);
  const fd=new FormData();
  fd.append("file",files[0]);
  fd.append("text",name);
  fd.append("position",document.getElementById("sign-position").value);
  fd.append("pages",document.getElementById("sign-pages").value);
  try{
    const resp=await callAPI("/sign-pdf",fd,"signpdf","Adding signature...");
    const blob=await resp.blob();
    showResult("signpdf","Done! File ready to download.");
    showDownloadBtn("signpdf",blob,`signed_${files[0].name}`);
  }catch(e){showResult("signpdf",e.message,true);}
  finally{setBtnState("signpdf",false,"Sign PDF");}
}
</script>

      </div>
    </div>
  </div>
</div>

</body>
</html>
