<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Merge PDF — CatchPDF</title>
    <link rel="stylesheet" href="shared.css">
    <script src="config.js"></script>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">CatchPDF</a></nav>
    <div class="tool-container">
        <h1>📎 Merge PDF</h1>
        <p>Combine multiple PDF files into one professional document.</p>
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" hidden accept=".pdf" multiple>
            <div style="font-size: 3rem;">📄+📄</div>
            <p>Select 2 or more PDF files</p>
        </div>
        <div id="file-list" style="margin-top: 15px; font-size: 0.9rem; color: #666;"></div>
        <div id="status" style="margin-top: 20px; font-weight: 600; color: var(--primary);"></div>
        <button onclick="runMerge()" class="btn-primary" style="margin-top: 15px;">Merge Files</button>
        <a id="downloadBtn" class="btn-primary" style="display: none; margin-top: 20px; text-decoration: none;">Download Merged PDF</a>
    </div>
    <script>
        const fileInput = document.getElementById('fileInput');
        fileInput.onchange = () => {
            const list = document.getElementById('file-list');
            list.innerText = fileInput.files.length + " files selected";
        };
        async function runMerge() {
            if(fileInput.files.length < 2) return alert("Select at least 2 files");
            document.getElementById('status').innerText = "Merging files...";
            const fd = new FormData();
            for(let f of fileInput.files) fd.append('files', f);
            try {
                const res = await fetch(window.CATCHPDF_CONFIG.API_BASE + "/merge-pdf", { method: 'POST', body: fd });
                const blob = await res.blob();
                document.getElementById('downloadBtn').href = window.URL.createObjectURL(blob);
                document.getElementById('downloadBtn').download = "CatchPDF_Merged.pdf";
                document.getElementById('downloadBtn').style.display = "inline-block";
                document.getElementById('status').innerText = "Success!";
            } catch (e) { document.getElementById('status').innerText = "Error merging files."; }
        }
    </script>
</body>
</html>
