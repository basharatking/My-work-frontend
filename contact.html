<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us — CatchPDF</title>
    <link rel="stylesheet" href="shared.css">
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">CatchPDF</a></nav>
    <div class="tool-container">
        <h1>📧 Contact Us</h1>
        <p>Questions or suggestions? We'd love to hear from you.</p>
        <div style="text-align: left; margin-top: 30px;">
            <label>Name</label><br>
            <input type="text" style="width: 100%; padding: 12px; margin: 8px 0 20px; border-radius: 8px; border: 1px solid #ddd;">
            
            <label>Email</label><br>
            <input type="email" style="width: 100%; padding: 12px; margin: 8px 0 20px; border-radius: 8px; border: 1px solid #ddd;">
            
            <label>Message</label><br>
            <textarea style="width: 100%; padding: 12px; margin: 8px 0 20px; border-radius: 8px; border: 1px solid #ddd; height: 100px;"></textarea>
            
            <button class="btn-primary" style="width: 100%;" onclick="alert('Message Sent!')">Send Message</button>
        </div>
    </div>
</body>
</html>
