<script>
async function run_jpg2pdf(){
  const files=fileStore["jpg2pdf"]; if(!files?.length){toast("Please select a file first","error");return;}
  setBtnState("jpg2pdf",true);
  const fd=new FormData();
  files.forEach(f=>fd.append('files',f));
  
  try{
    const resp=await callAPI("/jpg-to-pdf",fd,"jpg2pdf","Convert to PDF...");
    const blob=await resp.blob();
    showResult("jpg2pdf","Done! File ready to download.");
    showDownloadBtn("jpg2pdf",blob,"images.pdf");
  }catch(e){showResult("jpg2pdf",e.message,true);}
  finally{setBtnState("jpg2pdf",false,"Convert to PDF");}
}</script>
