<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

<body>
<div id="nav-placeholder"></div>
<div class="tool-page">
  <div class="tool-container">
    <div class="tool-header">
      <div class="tool-icon-wrap"></div>
      <h1 class="tool-title">Image to PDF</h1>
      <p class="tool-sub">Convert JPG, PNG and other image files into a single PDF document.</p>
    </div>
    <div class="tool-card">
      <div class="upload-zone" id="uz-jpg2pdf" onclick="document.getElementById('fi-jpg2pdf').click()">
        <div class="uz-icon"></div>
        <div class="uz-title">Drop your file here or click to browse</div>
        <div class="uz-sub">Up to 25 MB free · Secure &amp; private</div>
        <div class="uz-badge">🔒 Files deleted after processing</div>
        <input class="file-input" id="fi-jpg2pdf" type="file" accept="image/*" multiple onchange="handleFiles('jpg2pdf',this)">
      </div>
      <div class="frs-single" id="frs-jpg2pdf">
        <div class="frs-single-inner">
          <div class="frs-thumb-wrap" id="frs-thumb-jpg2pdf">
            <i class="ti ti-loader-2 ftc-spin" aria-hidden="true"></i>
          </div>
          <div class="frs-meta">
            <div class="frs-fname" id="frs-fname-jpg2pdf"></div>
            <div class="frs-fsize" id="frs-fsize-jpg2pdf"></div>
            <button class="frs-restart" type="button" onclick="_singleRestart('jpg2pdf')">
              <i class="ti ti-rotate" aria-hidden="true"></i> Change file
            </button>
          </div>
        </div>
        <button class="action-btn" id="btn-jpg2pdf" onclick="run_jpg2pdf()">Convert to PDF</button>
      </div>
      <div id="ocr-hint-jpg2pdf"></div>
      <div class="progress-wrap" id="pw-jpg2pdf"><div class="progress-track"><div class="progress-fill" id="pb-jpg2pdf"></div></div><div class="progress-label" id="pl-jpg2pdf">Processing…</div></div>
      <div class="result-box" id="rb-jpg2pdf"><p id="rb-jpg2pdf-msg"></p></div>
    </div>
<script>
async function run_jpg2pdf(){
  const files=fileStore["jpg2pdf"]; if(!files?.length){toast("Please select a file first","error");return;}
  setBtnState("jpg2pdf",true);
  const fd=new FormData();
  files.forEach(f=>fd.append('files',f));
  
  try{
    const resp=await callAPI("/jpg-to-pdf",fd,"jpg2pdf","Convert to PDF...");
    const blob=await resp.blob();
    showResult("jpg2pdf","Done! File ready to download.");
    showDownloadBtn("jpg2pdf",blob,"images.pdf");
  }catch(e){showResult("jpg2pdf",e.message,true);}
  finally{setBtnState("jpg2pdf",false,"Convert to PDF");}
}</script>
