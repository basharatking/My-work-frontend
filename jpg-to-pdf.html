<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image to PDF — CatchPDF</title>
    <link rel="stylesheet" href="shared.css">
    <script src="config.js"></script>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">CatchPDF</a></nav>
    <div class="tool-container">
        <h1>📥 Image to PDF</h1>
        <p>Convert JPG, PNG, and BMP images into a single PDF.</p>
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" hidden accept="image/*" multiple>
            <div style="font-size: 3rem;">📸</div>
            <p>Select one or more images</p>
        </div>
        <div id="status" style="margin-top: 20px;"></div>
        <button onclick="runImgToPdf()" class="btn-primary" style="margin-top: 15px;">Create PDF</button>
        <a id="downloadBtn" class="btn-primary" style="display: none; margin-top: 20px; text-decoration: none;">Download PDF</a>
    </div>
    <script>
        async function runImgToPdf() {
            const files = document.getElementById('fileInput').files;
            if(files.length === 0) return alert("Select images");
            document.getElementById('status').innerText = "Creating PDF...";
            const fd = new FormData();
            for(let f of files) fd.append('files', f);
            const res = await fetch(window.CATCHPDF_CONFIG.API_BASE + "/jpg-to-pdf", { method: 'POST', body: fd });
            const blob = await res.blob();
            document.getElementById('downloadBtn').href = window.URL.createObjectURL(blob);
            document.getElementById('downloadBtn').download = "CatchPDF_Converted.pdf";
            document.getElementById('downloadBtn').style.display = "inline-block";
            document.getElementById('status').innerText = "Finished!";
        }
    </script>
</body>
</html>
