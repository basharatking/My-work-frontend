<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Page Numbers — CatchPDF</title>
    <link rel="stylesheet" href="shared.css">
    <script src="config.js"></script>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">CatchPDF</a></nav>
    <div class="tool-container">
        <h1>🔢 Add Page Numbers</h1>
        <p>Add professional page numbering to your PDF document.</p>
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" hidden accept=".pdf">
            <div style="font-size: 3rem;">🔢</div>
            <p>Upload PDF File</p>
        </div>
        <div style="margin-top: 20px;">
            <select id="pos" style="padding: 12px; width: 84%; border-radius: 8px;">
                <option value="bottom-center">Bottom Center</option>
                <option value="bottom-right">Bottom Right</option>
                <option value="top-right">Top Right</option>
            </select>
        </div>
        <div id="status" style="margin-top: 20px;"></div>
        <button onclick="runPageNumbers()" class="btn-primary" style="margin-top: 15px;">Add Numbers</button>
        <a id="downloadBtn" class="btn-primary" style="display: none; margin-top: 20px; text-decoration: none;">Download PDF</a>
    </div>
    <script>
        async function runPageNumbers() {
            const file = document.getElementById('fileInput').files[0];
            if(!file) return alert("Select a file");
            document.getElementById('status').innerText = "Processing...";
            const fd = new FormData();
            fd.append('file', file);
            fd.append('position', document.getElementById('pos').value);
            const res = await fetch(window.CATCHPDF_CONFIG.API_BASE + "/add-page-numbers", { method: 'POST', body: fd });
            const blob = await res.blob();
            document.getElementById('downloadBtn').href = window.URL.createObjectURL(blob);
            document.getElementById('downloadBtn').download = "CatchPDF_Numbered.pdf";
            document.getElementById('downloadBtn').style.display = "inline-block";
            document.getElementById('status').innerText = "Numbers Added!";
        }
    </script>
</body>
</html>
