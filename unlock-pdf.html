<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unlock PDF — CatchPDF</title>
    <link rel="stylesheet" href="shared.css">
    <script src="config.js"></script>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">CatchPDF</a></nav>
    <div class="tool-container">
        <h1>🔓 Unlock PDF</h1>
        <p>Remove passwords and security from your PDF files.</p>
        
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" hidden accept=".pdf">
            <div style="font-size: 3rem;">🔓</div>
            <p>Upload Password Protected PDF</p>
        </div>

        <div id="password-area" style="margin-top: 20px;">
            <input type="password" id="pdfPass" placeholder="Enter PDF Password" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd; width: 80%;">
        </div>

        <div id="status" style="margin-top: 20px; font-weight: 600; color: var(--primary);"></div>
        <button onclick="runUnlock()" class="btn-primary" style="margin-top: 15px;">Unlock Now</button>
        <a id="downloadBtn" class="btn-primary" style="display: none; margin-top: 20px; text-decoration: none;">Download Unlocked PDF</a>
    </div>

    <script>
        async function runUnlock() {
            const file = document.getElementById('fileInput').files[0];
            const pass = document.getElementById('pdfPass').value;
            if(!file || !pass) return alert("Please select file and enter password");

            document.getElementById('status').innerText = "Unlocking...";
            const fd = new FormData();
            fd.append('file', file);
            fd.append('password', pass);

            try {
                const res = await fetch(window.CATCHPDF_CONFIG.API_BASE + "/unlock-pdf", { method: 'POST', body: fd });
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const dl = document.getElementById('downloadBtn');
                dl.href = url;
                dl.download = "CatchPDF_Unlocked.pdf";
                dl.style.display = "inline-block";
                document.getElementById('status').innerText = "Unlocked Successfully!";
            } catch (e) { document.getElementById('status').innerText = "Error: Check password."; }
        }
    </script>
</body>
</html>
