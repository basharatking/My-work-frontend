<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rotate PDF — CatchPDF</title>
    <link rel="stylesheet" href="shared.css">
    <script src="config.js"></script>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">CatchPDF</a></nav>
    <div class="tool-container">
        <h1>🔄 Rotate PDF</h1>
        <p>Rotate your PDF pages by 90, 180, or 270 degrees.</p>
        <input type="file" id="fileInput" hidden accept=".pdf">
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 3rem;">🔄</div>
            <p>Select PDF to Rotate</p>
        </div>
        <select id="angle" style="margin-top: 20px; padding: 12px; width: 84%; border-radius: 8px;">
            <option value="90">90° Right</option>
            <option value="180">180° Flip</option>
            <option value="270">90° Left</option>
        </select>
        <div id="status" style="margin-top: 20px;"></div>
        <button onclick="runRotate()" class="btn-primary" style="margin-top: 15px;">Rotate Now</button>
        <a id="downloadBtn" class="btn-primary" style="display: none; margin-top: 20px; text-decoration: none;">Download Rotated PDF</a>
    </div>
    <script>
        async function runRotate() {
            const file = document.getElementById('fileInput').files[0];
            if(!file) return alert("Select a file");
            document.getElementById('status').innerText = "Rotating...";
            const fd = new FormData();
            fd.append('file', file);
            fd.append('angle', document.getElementById('angle').value);
            const res = await fetch(window.CATCHPDF_CONFIG.API_BASE + "/rotate-pdf", { method: 'POST', body: fd });
            const blob = await res.blob();
            document.getElementById('downloadBtn').href = window.URL.createObjectURL(blob);
            document.getElementById('downloadBtn').download = "CatchPDF_Rotated.pdf";
            document.getElementById('downloadBtn').style.display = "inline-block";
            document.getElementById('status').innerText = "Done!";
        }
    </script>
</body>
</html>
