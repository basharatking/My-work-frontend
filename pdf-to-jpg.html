<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF to JPG — CatchPDF</title>
    <link rel="stylesheet" href="shared.css">
    <script src="config.js"></script>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">CatchPDF</a></nav>
    <div class="tool-container">
        <h1>🖼️ PDF to JPG</h1>
        <p>Convert each PDF page into a high-quality JPG image.</p>
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" hidden accept=".pdf">
            <div style="font-size: 3rem;">🖼️</div>
            <p>Select PDF File</p>
        </div>
        <div id="status" style="margin-top: 20px;"></div>
        <button onclick="runConvert()" class="btn-primary" style="margin-top: 15px;">Convert to JPG</button>
        <a id="downloadBtn" class="btn-primary" style="display: none; margin-top: 20px; text-decoration: none;">Download Images (ZIP)</a>
    </div>
    <script>
        async function runConvert() {
            const file = document.getElementById('fileInput').files[0];
            if(!file) return alert("Select a file");
            document.getElementById('status').innerText = "Converting pages...";
            const fd = new FormData();
            fd.append('file', file);
            const res = await fetch(window.CATCHPDF_CONFIG.API_BASE + "/pdf-to-jpg", { method: 'POST', body: fd });
            const blob = await res.blob();
            document.getElementById('downloadBtn').href = window.URL.createObjectURL(blob);
            document.getElementById('downloadBtn').download = "CatchPDF_Images.zip";
            document.getElementById('downloadBtn').style.display = "inline-block";
            document.getElementById('status').innerText = "Conversion Complete!";
        }
    </script>
</body>
</html>
