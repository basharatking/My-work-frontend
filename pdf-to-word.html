<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF to Word — CatchPDF</title>
    <link rel="stylesheet" href="shared.css">
    <script src="config.js"></script>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">CatchPDF</a></nav>
    <div class="tool-container">
        <h1>📝 PDF to Word</h1>
        <p>Convert your PDF into an editable Word document.</p>
        <input type="file" id="fileInput" hidden accept=".pdf">
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 3rem;">📝</div>
            <p>Choose PDF File</p>
        </div>
        <div id="status" style="margin-top: 20px; font-weight: 600; color: var(--primary);"></div>
        <a id="downloadBtn" class="btn-primary" style="display: none; margin-top: 20px; text-decoration: none;">Download .DOCX</a>
    </div>
    <script>
        document.getElementById('fileInput').onchange = async (e) => {
            const file = e.target.files[0];
            document.getElementById('status').innerText = "Converting to Word...";
            const fd = new FormData();
            fd.append('file', file);
            try {
                const res = await fetch(window.CATCHPDF_CONFIG.API_BASE + "/pdf-to-word", { method: 'POST', body: fd });
                const blob = await res.blob();
                const dl = document.getElementById('downloadBtn');
                dl.href = window.URL.createObjectURL(blob);
                dl.download = "CatchPDF_Converted.docx";
                dl.style.display = "inline-block";
                document.getElementById('status').innerText = "Ready!";
            } catch (e) { document.getElementById('status').innerText = "Conversion failed."; }
        };
    </script>
</body>
</html>
