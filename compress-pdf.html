<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Compress PDF — CatchPDF</title>
    <link rel="stylesheet" href="shared.css">
    <script src="config.js"></script>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">CatchPDF</a></nav>
    <div class="tool-container">
        <h1>🗜️ Compress PDF</h1>
        <p>Reduce file size while keeping the best quality.</p>
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" hidden accept=".pdf">
            <div style="font-size: 3rem;">🗜️</div>
            <p>Upload PDF to Compress</p>
        </div>
        <div style="margin-top: 20px;">
            <select id="level" style="padding: 12px; width: 84%; border-radius: 8px;">
                <option value="medium">Recommended Compression</option>
                <option value="high">Extreme (Smaller size, lower quality)</option>
                <option value="low">Low (High quality, larger size)</option>
            </select>
        </div>
        <div id="status" style="margin-top: 20px; font-weight: 600;"></div>
        <button onclick="runCompress()" class="btn-primary" style="margin-top: 15px;">Compress Now</button>
        <a id="downloadBtn" class="btn-primary" style="display: none; margin-top: 20px; text-decoration: none;">Download Compressed PDF</a>
    </div>
    <script>
        async function runCompress() {
            const file = document.getElementById('fileInput').files[0];
            if(!file) return alert("Select a file");
            document.getElementById('status').innerText = "Compressing...";
            const fd = new FormData();
            fd.append('file', file);
            fd.append('level', document.getElementById('level').value);
            const res = await fetch(window.CATCHPDF_CONFIG.API_BASE + "/compress-pdf", { method: 'POST', body: fd });
            const blob = await res.blob();
            document.getElementById('downloadBtn').href = window.URL.createObjectURL(blob);
            document.getElementById('downloadBtn').download = "CatchPDF_Compressed.pdf";
            document.getElementById('downloadBtn').style.display = "inline-block";
            document.getElementById('status').innerText = "Compression Done!";
        }
    </script>
</body>
</html>
