  <div class="tool-container">
    <div class="tool-header">
      <div class="tool-icon-wrap"></div>
      <h1 class="tool-title">Optimize PDF</h1>
      <p class="tool-sub">Process your optimize pdf instantly. Free and secure.</p>
    </div>
    <div class="tool-card">
      <div class="upload-zone" onclick="document.getElementById('fi-optimize').click()">
        <div class="uz-icon"></div>
        <div class="uz-title">Drop your file here or click to browse</div>
        <div class="uz-sub">Up to 25 MB free · Secure &amp; private</div>
        <div class="uz-badge">🔒 Files deleted after processing</div>
        <input class="file-input" id="fi-optimize" type="file" accept=".pdf" onchange="handleFiles('optimize',this)">
      </div>
      <div class="file-chips" id="fl-optimize"></div>
      <div class="pdf-preview-area" id="preview-optimize"><div class="pdf-preview-header"><span>Preview</span><strong></strong></div><div class="pdf-canvas-wrap"></div></div>
      <div id="ocr-hint-optimize"></div>
      
      <button class="action-btn" id="btn-optimize" onclick="run_optimize()">Process File</button>
      <div class="progress-wrap" id="pw-optimize"><div class="progress-track"><div class="progress-fill" id="pb-optimize"></div></div><div class="progress-label" id="pl-optimize">Processing…</div></div>
      <div class="result-box" id="rb-optimize"><p id="rb-optimize-msg"></p></div>
    </div>
<script>
async function run_optimize(){
  const files=fileStore["optimize"]; if(!files?.length){toast("Please select a file first","error");return;}
  setBtnState("optimize",true);
  const fd=new FormData();
  fd.append("file",files[0]);
  
  try{
    const resp=await callAPI("/compress-pdf",fd,"optimize","Process File...");
    const blob=await resp.blob();
    showResult("optimize","Done! File ready to download.");
    showDownloadBtn("optimize",blob,"output.pdf");
  }catch(e){showResult("optimize",e.message,true);}
  finally{setBtnState("optimize",false,"Process File");}
}</script>
