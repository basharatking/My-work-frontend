<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard — RunDocs</title>
<meta name="description" content="Your RunDocs dashboard — account overview and conversion history.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://rundocs.netlify.app/dashboard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
.dash-page{ max-width:1080px; margin:0 auto; padding:calc(var(--nav-h) + 2rem) 1.5rem 4rem; }
.dash-gate{ min-height:70vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem; }
.dash-gate i{ font-size:2.5rem; color:var(--ink5); margin-bottom:1rem; display:block; }

/* Profile header */
.dash-head{ display:flex; align-items:center; gap:16px; margin-bottom:2rem; flex-wrap:wrap; }
.dash-avatar{ width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg,var(--brand),var(--brand-light)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:20px; flex-shrink:0; box-shadow:0 4px 14px rgba(79,110,247,.3); }
.dash-head-text{ flex:1; min-width:200px; }
.dash-hello{ font-family:var(--font-display); font-size:24px; font-weight:700; color:var(--ink); letter-spacing:-.3px; }
.dash-email{ font-size:13.5px; color:var(--ink4); margin-top:2px; }
.dash-signout{ display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:var(--r); font-size:13.5px; font-weight:500; color:var(--ink3); border:1.5px solid var(--border2); background:transparent; cursor:pointer; transition:var(--t); white-space:nowrap; }
.dash-signout:hover{ border-color:var(--red); color:var(--red); background:var(--red-bg); }

/* Stat cards */
.dash-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:2.25rem; }
.dash-stat{ background:var(--bg); border:1px solid var(--border); border-radius:var(--rxl); padding:1.25rem 1.1rem; }
.dash-stat-icon{ width:34px; height:34px; border-radius:10px; background:var(--brand-pale); color:var(--brand); display:flex; align-items:center; justify-content:center; font-size:16px; margin-bottom:.7rem; }
.dash-stat-val{ font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--ink); letter-spacing:-.3px; line-height:1.1; }
.dash-stat-lbl{ font-size:12.5px; color:var(--ink4); margin-top:3px; }

/* History section */
.dash-hist-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:1rem; flex-wrap:wrap; }
.dash-hist-title{ font-size:17px; font-weight:700; color:var(--ink); }
.dash-hist-actions{ display:flex; align-items:center; gap:8px; }
.dash-search{ display:flex; align-items:center; gap:8px; border:1.5px solid var(--border2); border-radius:var(--r); padding:7px 12px; background:var(--bg); }
.dash-search i{ color:var(--ink4); font-size:15px; }
.dash-search input{ border:none; outline:none; background:transparent; font-size:13.5px; color:var(--ink); width:150px; font-family:inherit; }
.dash-clear-btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:var(--r); font-size:13px; font-weight:500; color:var(--ink3); border:1.5px solid var(--border2); background:transparent; cursor:pointer; transition:var(--t); white-space:nowrap; }
.dash-clear-btn:hover{ border-color:var(--red); color:var(--red); background:var(--red-bg); }

.hist-list{ border:1px solid var(--border); border-radius:var(--rxl); overflow:hidden; background:var(--bg); }
.hist-row{ display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--border); transition:var(--t); }
.hist-row:last-child{ border-bottom:none; }
.hist-row:hover{ background:var(--bg2); }
.hist-icon{ width:36px; height:36px; border-radius:10px; background:var(--bg3); color:var(--brand); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.hist-main{ flex:1; min-width:0; }
.hist-tool{ font-size:13.5px; font-weight:600; color:var(--ink); }
.hist-file{ font-size:12.5px; color:var(--ink4); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hist-meta{ display:flex; align-items:center; gap:14px; flex-shrink:0; }
.hist-size{ font-size:12px; color:var(--ink4); min-width:56px; text-align:right; }
.hist-date{ font-size:12px; color:var(--ink4); min-width:88px; text-align:right; }
.hist-status{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:100px; background:var(--green-bg); color:var(--green); border:1px solid var(--green-border); white-space:nowrap; }
.hist-del{ background:none; border:none; color:var(--ink5); cursor:pointer; font-size:15px; padding:4px; border-radius:6px; transition:var(--t); flex-shrink:0; }
.hist-del:hover{ color:var(--red); background:var(--red-bg); }

.dash-empty{ text-align:center; padding:3.5rem 1.5rem; }
.dash-empty i{ font-size:2.25rem; color:var(--ink5); margin-bottom:.9rem; display:block; }
.dash-empty h3{ font-size:16px; font-weight:700; color:var(--ink); margin-bottom:.35rem; }
.dash-empty p{ font-size:13.5px; color:var(--ink4); margin-bottom:1.25rem; }

.dash-skel{ padding:16px; }
.skel-line{ height:52px; border-radius:10px; background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 37%,var(--bg3) 63%); background-size:400% 100%; animation:skel 1.4s ease infinite; margin-bottom:8px; }
@keyframes skel{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }

@media (max-width:760px){
  .dash-stats{ grid-template-columns:repeat(2,1fr); }
  .dash-search input{ width:110px; }
  .hist-date{ display:none; }
}
@media (max-width:480px){
  .hist-size{ display:none; }
}
</style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="dash-page" id="dash-page" style="display:none">
  <div class="dash-head">
    <div class="dash-avatar" id="dash-avatar">--</div>
    <div class="dash-head-text">
      <div class="dash-hello" id="dash-hello">Welcome back</div>
      <div class="dash-email" id="dash-email"></div>
    </div>
    <button class="dash-signout" onclick="signOut()"><i class="ti ti-logout" aria-hidden="true"></i> Sign Out</button>
  </div>

  <div class="dash-stats">
    <div class="dash-stat">
      <div class="dash-stat-icon"><i class="ti ti-file-check" aria-hidden="true"></i></div>
      <div class="dash-stat-val" id="stat-total">0</div>
      <div class="dash-stat-lbl">Total Conversions</div>
    </div>
    <div class="dash-stat">
      <div class="dash-stat-icon"><i class="ti ti-calendar-event" aria-hidden="true"></i></div>
      <div class="dash-stat-val" id="stat-month">0</div>
      <div class="dash-stat-lbl">This Month</div>
    </div>
    <div class="dash-stat">
      <div class="dash-stat-icon"><i class="ti ti-database" aria-hidden="true"></i></div>
      <div class="dash-stat-val" id="stat-data">0 MB</div>
      <div class="dash-stat-lbl">Data Processed</div>
    </div>
    <div class="dash-stat">
      <div class="dash-stat-icon"><i class="ti ti-star" aria-hidden="true"></i></div>
      <div class="dash-stat-val" id="stat-favtool" style="font-size:15px">—</div>
      <div class="dash-stat-lbl">Favorite Tool</div>
    </div>
  </div>

  <div class="dash-hist-head">
    <div class="dash-hist-title">Conversion History</div>
    <div class="dash-hist-actions">
      <div class="dash-search">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="hist-search" placeholder="Search tool or file…" oninput="_renderHistory()">
      </div>
      <button class="dash-clear-btn" id="hist-clear-btn" onclick="clearAllHistory()"><i class="ti ti-trash" aria-hidden="true"></i> Clear All</button>
    </div>
  </div>

  <div id="hist-container">
    <div class="dash-skel">
      <div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div>
    </div>
  </div>
</div>

<div class="dash-gate" id="dash-gate" style="display:none">
  <div>
    <i class="ti ti-lock" aria-hidden="true"></i>
    <h3 style="font-size:18px;font-weight:700;color:var(--ink);margin-bottom:.4rem">Sign in to view your dashboard</h3>
    <p style="font-size:14px;color:var(--ink4);margin-bottom:1.5rem">Track your conversion history and account activity.</p>
    <a href="/sign-in" class="btn btn-primary">Sign In</a>
  </div>
</div>

<div id="footer-placeholder"></div>
<script src="shared.js"></script>
<script>
let _allConversions = [];

function _bytesFmt(b){
  if(!b) return "0 B";
  if(b<1024) return b+" B";
  if(b<1048576) return (b/1024).toFixed(1)+" KB";
  return (b/1048576).toFixed(1)+" MB";
}
function _dateFmt(iso){
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString()===now.toDateString();
  if(sameDay) return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString([], {month:"short",day:"numeric"});
}
function _toolIcon(path){ return (typeof TOOL_ICONS!=="undefined" && TOOL_ICONS[path]) || "ti-file-text"; }

function _renderHistory(){
  const q = (document.getElementById("hist-search").value || "").toLowerCase().trim();
  const rows = _allConversions.filter(c =>
    !q || (c.tool_name||"").toLowerCase().includes(q) || (c.file_name||"").toLowerCase().includes(q)
  );
  const box = document.getElementById("hist-container");
  const clearBtn = document.getElementById("hist-clear-btn");
  clearBtn.style.display = _allConversions.length ? "inline-flex" : "none";

  if(!_allConversions.length){
    box.innerHTML = `<div class="dash-empty">
      <i class="ti ti-history-toggle" aria-hidden="true"></i>
      <h3>No conversions yet</h3>
      <p>Your processed files will show up here once you use a tool.</p>
      <a href="/#tools" class="btn btn-primary btn-sm">Browse Tools</a>
    </div>`;
    return;
  }
  if(!rows.length){
    box.innerHTML = `<div class="dash-empty">
      <i class="ti ti-search-off" aria-hidden="true"></i>
      <h3>No matches</h3>
      <p>Try a different search term.</p>
    </div>`;
    return;
  }
  box.innerHTML = `<div class="hist-list">${rows.map(c => `
    <div class="hist-row" data-id="${c.id}">
      <div class="hist-icon"><i class="ti ${_toolIcon(c.tool_path)}" aria-hidden="true"></i></div>
      <div class="hist-main">
        <div class="hist-tool">${_esc(c.tool_name)}</div>
        <div class="hist-file">${_esc(c.file_name || "—")}</div>
      </div>
      <div class="hist-meta">
        <span class="hist-size">${_bytesFmt(c.file_size)}</span>
        <span class="hist-date">${_dateFmt(c.created_at)}</span>
        <span class="hist-status"><i class="ti ti-check" aria-hidden="true"></i> Done</span>
        <button class="hist-del" title="Delete entry" onclick="deleteHistoryRow('${c.id}')"><i class="ti ti-x" aria-hidden="true"></i></button>
      </div>
    </div>`).join("")}</div>`;
}

async function deleteHistoryRow(id){
  const sb = await _sbClient(); if(!sb) return;
  await sb.from("conversions").delete().eq("id", id);
  _allConversions = _allConversions.filter(c => c.id !== id);
  _renderHistory();
  _renderStats();
}

async function clearAllHistory(){
  if(!_allConversions.length) return;
  if(!confirm("Delete your entire conversion history? This can't be undone.")) return;
  const sb = await _sbClient(); if(!sb) return;
  const user = await getUser(); if(!user) return;
  await sb.from("conversions").delete().eq("user_id", user.id);
  _allConversions = [];
  _renderHistory();
  _renderStats();
  toast("History cleared", "success");
}

function _renderStats(){
  const total = _allConversions.length;
  const now = new Date();
  const thisMonth = _allConversions.filter(c => {
    const d = new Date(c.created_at);
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  }).length;
  const totalBytes = _allConversions.reduce((s,c) => s + (c.file_size||0), 0);
  const counts = {};
  _allConversions.forEach(c => { counts[c.tool_name] = (counts[c.tool_name]||0)+1; });
  let favTool = "—", favCount = 0;
  Object.entries(counts).forEach(([name,ct]) => { if(ct>favCount){ favCount=ct; favTool=name; } });

  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-month").textContent = thisMonth;
  document.getElementById("stat-data").textContent = _bytesFmt(totalBytes);
  document.getElementById("stat-favtool").textContent = favTool;
}

async function initDashboard(){
  const user = await getUser();
  if(!user){
    document.getElementById("dash-gate").style.display = "flex";
    return;
  }
  document.getElementById("dash-page").style.display = "block";
  const name = user.user_metadata?.full_name || user.email?.split("@")[0] || "there";
  document.getElementById("dash-avatar").textContent = name.slice(0,2).toUpperCase();
  document.getElementById("dash-hello").textContent = `Welcome back, ${name.split(" ")[0]}`;
  document.getElementById("dash-email").textContent = user.email || "";

  try{
    const sb = await _sbClient();
    const { data, error } = await sb.from("conversions")
      .select("*")
      .order("created_at", { ascending:false })
      .limit(500);
    if(error) throw error;
    _allConversions = data || [];
  }catch(e){
    _allConversions = [];
    document.getElementById("hist-container").innerHTML = `<div class="dash-empty">
      <i class="ti ti-alert-triangle" aria-hidden="true"></i>
      <h3>Couldn't load history</h3>
      <p>Please refresh the page to try again.</p>
    </div>`;
    document.getElementById("hist-clear-btn").style.display = "none";
    return;
  }
  _renderStats();
  _renderHistory();
}

document.addEventListener("DOMContentLoaded", () => { setTimeout(initDashboard, 60); });
</script>
</body>
</html>
