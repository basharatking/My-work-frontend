<script>
async function run_bankstmt(){
  const files=fileStore["bankstmt"]; if(!files?.length){toast("Please select a file first","error");return;}
  setBtnState("bankstmt",true);
  const fd=new FormData();
  fd.append("file",files[0]);
  
  try{
    const resp=await callAPI("/pdf-to-excel",fd,"bankstmt","Process File...");
    const blob=await resp.blob();
    showResult("bankstmt","Done! File ready to download.");
    showDownloadBtn("bankstmt",blob,"output.pdf");
  }catch(e){showResult("bankstmt",e.message,true);}
  finally{setBtnState("bankstmt",false,"Process File");}
}</script>
