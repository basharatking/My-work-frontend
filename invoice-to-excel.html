<script>
async function run_invoice2xl(){
  const files=fileStore["invoice2xl"]; if(!files?.length){toast("Please select a file first","error");return;}
  setBtnState("invoice2xl",true);
  const fd=new FormData();
  fd.append("file",files[0]);
  
  try{
    const resp=await callAPI("/pdf-to-excel",fd,"invoice2xl","Process File...");
    const blob=await resp.blob();
    showResult("invoice2xl","Done! File ready to download.");
    showDownloadBtn("invoice2xl",blob,"output.pdf");
  }catch(e){showResult("invoice2xl",e.message,true);}
  finally{setBtnState("invoice2xl",false,"Process File");}
}</script>
