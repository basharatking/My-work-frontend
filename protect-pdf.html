<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Protect PDF — CatchPDF</title>
    <link rel="stylesheet" href="shared.css">
    <script src="config.js"></script>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">CatchPDF</a></nav>
    <div class="tool-container">
        <h1>🔒 Protect PDF</h1>
        <p>Encrypt your PDF with a strong password.</p>
        
        <input type="file" id="fileInput" hidden accept=".pdf">
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 3rem;">🔐</div>
            <p>Choose PDF to Protect</p>
        </div>

        <input type="password" id="pass1" placeholder="Create Password" style="margin-top:20px; padding:12px; width:80%; border-radius:8px; border:1px solid #ddd;">
        
        <div id="status" style="margin-top:20px;"></div>
        <button onclick="runProtect()" class="btn-primary" style="margin-top:15px;">Set Password</button>
        <a id="downloadBtn" class="btn-primary" style="display:none; margin-top:20px; text-decoration:none;">Download Protected PDF</a>
    </div>

    <script>
        async function runProtect() {
            const file = document.getElementById('fileInput').files[0];
            const pw = document.getElementById('pass1').value;
            if(!file || !pw) return alert("File and password required");

            document.getElementById('status').innerText = "Encrypting...";
            const fd = new FormData();
            fd.append('file', file);
            fd.append('password', pw);

            const res = await fetch(window.CATCHPDF_CONFIG.API_BASE + "/protect-pdf", { method: 'POST', body: fd });
            const blob = await res.blob();
            document.getElementById('downloadBtn').href = window.URL.createObjectURL(blob);
            document.getElementById('downloadBtn').download = "CatchPDF_Protected.pdf";
            document.getElementById('downloadBtn').style.display = "inline-block";
            document.getElementById('status').innerText = "File Protected!";
        }
    </script>
</body>
</html>
